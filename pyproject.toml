[project]
name = "plotpack"
version = "0.1.0"
description = "Figures that carry their own data, generating code and provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
tables = ["pandas>=2"]

[project.scripts]
plotpack = "plotpack.cli:main"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9", "pandas>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotpack"]
